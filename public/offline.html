<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AVORA — Offline</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b1f17;
        color: #ffffff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.65);
        margin: 0 0 24px;
        max-width: 320px;
      }
      button {
        background: #22c55e;
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 10px 28px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #16a34a;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/icons/icon-192.png" alt="AVORA" />
      <h1>You're offline</h1>
      <p>AVORA couldn't reach the network. Check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
